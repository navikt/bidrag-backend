name: bidrag-dokument-journalpost-feature
min_replicas: 1
ingresses:
  - https://bidrag-dokument-journalpost-feature.intern.dev.nav.no
  - https://bidrag-dokument-journalpost-feature.dev-fss-pub.nais.io
kafka:
  pool: nav-dev
env:
  ABAC_PDP_ENDPOINT_URL: https://abac-bidrag-q1.dev.intern.nav.no/application/asm-pdp/authorize
  PIP_URL: https://bidrag-sak-q1.intern-dev.nav.no/bidrag-sak
  BREVSERVER_ONLINEBREV: QA.Q475.BREVSERVER_ONLINEBREV
  BREVSERVER_URL: https://wasapp-q1.adeo.no/brevweb/
  BREVSERVER_KVITTERING_QUEUE: QA.Q464.BISYS_REPLY_QUE
  BREVSERVER_NAIS_URL: https://brevserver-nais-q1.intern.dev.nav.no
  BREVSERVER_NAIS_SCOPE: dev-fss.teamdokumenthandtering.brevserver-nais-q1
  BRUK_BREVSERVER_REST: "true"
  TOPIC_JOURNALPOST: bidrag.journalpost-feature
  TOPIC_DOKUMENT: bidrag.dokument-feature
  MQ_QUEUE_MANAGER: MQLS02
  MQ_PORT: 1413
  MQ_HOSTNAME: b27apvl220.preprod.local
  MQ_CHANNEL: Q1_BDJOURNALPOST
  BIDRAG_DB_HOST: ztest.test.local
  BIDRAG_DB_PORT: 5025
  BIDRAG_DB_NAME: QDB2
  BIDRAG_DB_SCHEMA: BI464Q1
  NORG2_API_V1_URL: https://norg2.dev.intern.nav.no/norg2/api/v1
  OPPGAVE_OPPGAVER_URL: https://oppgave-q1.intern.dev.nav.no/api/v1/oppgaver
