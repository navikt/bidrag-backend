  BIDRAG_TILGANGSKONTROLL_URL: https://bidrag-tilgangskontroll-feature.intern.dev.nav.no
  BIDRAG_TILGANGSKONTROLL_SCOPE: dev-gcp.bidrag.bidrag-tilgangskontroll-feature
  JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
vault:
  paths:
    - kvPath: /serviceuser/data/dev/srvbdjournalpost
      mountPath: /var/run/secrets/srvbdjournalpost
    - kvPath: /serviceuser/data/dev/srvbisys
      mountPath: /var/run/secrets/srvbisys
    - kvPath: /kv/preprod/fss/bidrag-dokument-journalpost-feature/bidrag
      mountPath: /var/run/secrets/nais.io/vault
azure_access_inbound:
  - application: bidrag-dokument-feature
    namespace: bidrag
    cluster: dev-fss
  - application: bidrag-dokument-forsendelse-feature
    namespace: bidrag
    cluster: dev-gcp
outbound-access-hosts:
  - brevserver-nais-q1.intern.dev.nav.no
database:
  secret_name: bidrag-dokument-journalpost-feature-database