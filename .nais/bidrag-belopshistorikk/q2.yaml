name: bidrag-belopshistorikk-q2
ingresses:
  - https://bidrag-belopshistorikk-q2.intern.dev.nav.no
dbname: bidrag-belopshistorikk-q2
kafka:
  pool: nav-dev
kafka-topic-vedtak: bidrag.vedtak-q2
spring-profiles: live,nais
azureAccessInbound:
  - application: bidrag-behandling-q2
    namespace: bidrag
    cluster: dev-gcp
  - application: bisys
    namespace: bidrag
    cluster: dev-fss
  - application: bidrag-automatisk-jobb-q2
    namespace: bidrag
    cluster: dev-gcp
  - application: bidrag-ui
    namespace: bidrag
    cluster: dev-fss
  - application: azure-token-generator
    namespace: nais
    cluster: dev-gcp
  - application: bidrag-frontend-q2
    namespace: bidrag
    cluster: dev-gcp
  - application: bidrag-localauth
    namespace: bidrag
    cluster: dev-gcp

env:
  BIDRAG_PERSON_URL: https://bidrag-person-q2.dev-fss-pub.nais.io/bidrag-person
  BIDRAG_PERSON_SCOPE: dev-fss.bidrag.bidrag-person-q2
access-outbound:
  BIDRAG_PERSON_URL: bidrag-person-q2.dev-fss-pub.nais.io
spec:
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 2048Mi
    requests:
      cpu: 50m
      memory: 512Mi
  gcp:
    sqlInstances:
      tier: db-f1-micro
      diskAutoresize: false
      auditlog: "off"