name: bidrag-bbm
min_replicas: 1
ingresses:
  - https://bidrag-bbm.dev.intern.nav.no
  - https://bidrag-bbm.dev-fss-pub.nais.io
env:
  DB_HOST: ztest.test.local
  DB_PORT: 5025
  DB_NAME: QDB2
  BBM_DB_SCHEMA: BI460Q2
  BISYS_DB_SCHEMA: BI464Q2
  JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -XX:MaxRAMPercentage=80.0
azure_access_inbound:
  - application: bidrag-behandling-q2
    namespace: bidrag
    cluster: dev-gcp
  - application: bidrag-arbeidsflyt
    namespace: bidrag
    cluster: dev-gcp
  - application: bidrag-dokument-forsendelse
    namespace: bidrag
    cluster: dev-gcp
database:
  secret_name: bidrag-bbm-db
