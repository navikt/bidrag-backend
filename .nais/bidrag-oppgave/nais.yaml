apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: {{ name }}
  namespace: bidrag
  labels:
    team: bidrag
spec:
  image: {{ image }}
  port: 8080
  azure:
    application:
      enabled: true
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  liveness:
    path: /internal/health/liveness
    initialDelay: 10
  readiness:
    path: /internal/health/readiness
    initialDelay: 10
  prometheus:
    enabled: true
    path: /internal/prometheus
  replicas:
    max: {{ replicas.max }}
    min: {{ replicas.min }}
  resources:
    limits:
      memory: {{ limits.memory }}
    requests:
      cpu: {{ requests.cpu }}
      memory: {{ requests.memory }}
  ingresses:
  {{#each ingresses as |url|}}
    - {{url}}
  {{/each}}
  env:
  {{#each env}}
    - name: {{@key}}
      value: "{{this}}"
  {{/each}}
  accessPolicy:
    inbound:
      rules:
      {{#each accessPolicyInbound as |rule|}}
        - application: {{rule.application}}
          namespace: {{rule.namespace}}
          cluster: {{rule.cluster}}
      {{/each}}
    outbound:
      external:
        - host: {{ env.OPPGAVE_API_HOST }}
      rules:
        - application: logging
          namespace: nais-system
