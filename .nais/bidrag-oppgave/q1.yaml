name: bidrag-oppgave-q1
ingresses:
  - https://bidrag-oppgave-q1.intern.dev.nav.no
replicas:
  max: 1
  min: 1
env:
  APP_OPPGAVE_URL: https://oppgave-q1.dev-fss-pub.nais.io
  APP_OPPGAVE_AUDIENCE: api://dev-fss.oppgavehandtering.oppgave-q1/.default

inbound:
  rules:
    - application: bidrag-frontend-q1
      namespace: bidrag
      cluster: dev-gcp
    - application: azure-token-generator
      namespace: nais
      cluster: dev-gcp
    - application: bidrag-localauth
      namespace: bidrag
      cluster: dev-gcp

outbound:
  rules:
#    - application: bidrag-person
  external:
    - oppgave-q1.dev-fss-pub.nais.io
