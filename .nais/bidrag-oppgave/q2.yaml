name: bidrag-oppgave-q2
ingresses:
  - https://bidrag-oppgave-q2.intern.dev.nav.no
replicas:
  max: 1
  min: 1
env:
  APP_OPPGAVE_URL: https://oppgave.dev-fss-pub.nais.io
  APP_OPPGAVE_AUDIENCE: api://dev-fss.oppgavehandtering.oppgave/.default

inbound:
  rules:
    - application: bidrag-frontend-q2
      namespace: bidrag
      cluster: dev-gcp
    - application: azure-token-generator
      namespace: nais
      cluster: dev-gcp
    - application: bidrag-localauth
      namespace: bidrag
      cluster: dev-gcp

outbound:
  rules:

  external:
    - oppgave.dev-fss-pub.nais.io
