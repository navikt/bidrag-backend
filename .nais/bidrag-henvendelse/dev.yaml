name: bidrag-henvendelse
ingresses:
  - https://bidrag-henvendelse.intern.dev.nav.no
env:
  # sf-henvendelse-api-proxy ligger i namespace teamnks. Se .nais/dev-gcp.yaml i
  # navikt/sf-henvendelse-api-proxy - vi må legges inn i deres accessPolicy.inbound
  # før kallene går gjennom.
  HENVENDELSE_URL: https://sf-henvendelse.intern.dev.nav.no
  HENVENDELSE_SCOPE: dev-gcp.teamnks.sf-henvendelse-api-proxy
  # bidrag-person kjører i FSS og er delt i q1/q2 i dev. q2 brukes fordi det kun er
  # syntetiske personer der.
  BIDRAG_PERSON_URL: https://bidrag-person-q2.intern.dev.nav.no
  BIDRAG_PERSON_SCOPE: dev-fss.bidrag.bidrag-person-q2
  JAVA_OPTS: -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -XX:MaxRAMPercentage=80.0
azure_access_inbound:
  # NB: appen slår opp aktørid mot bidrag-person-q2. En q1-tester som slår opp en person som
  # bare finnes i q1 får tom liste, ikke feil.
  - application: bidrag-frontend-q1
    namespace: bidrag
    cluster: dev-gcp
  - application: bidrag-frontend-q2
    namespace: bidrag
    cluster: dev-gcp
  - application: bidrag-localauth
    namespace: bidrag
    cluster: dev-gcp
outbound-access-hosts:
  - sf-henvendelse.intern.dev.nav.no
  - bidrag-person-q2.intern.dev.nav.no
