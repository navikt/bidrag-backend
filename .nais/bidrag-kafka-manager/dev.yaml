kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: bidrag-kafka-manager
  namespace: bidrag
  labels:
    team: bidrag
spec:
  image: {{ image }}
  port: 8080
  webproxy: true
  ingresses:
    - https://bidrag-kafka-manager.intern.dev.nav.no
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /actuator/health/readiness
    initialDelay: 20
  liveness:
    path: /actuator/health/liveness
    initialDelay: 20
  replicas:
    min: 1
    max: 1  # 1 instance is required since in-memory session management is used
    cpuThresholdPercentage: 75
  resources:
    limits:
      memory: 2000Mi
    requests:
      cpu: 200m
      memory: 1000Mi
  azure: # Required
    application:
      enabled: true
      tenant: nav.no
      claims:
        groups:
          - id: f2fee82c-746d-478e-8749-3ba0a87ff237 # Required for authorization
  kafka: # Optional. Required for Aiven
    pool: nav-dev
  env:
    - name: "SPRING_CONFIG_ADDITIONAL-LOCATION"
      value: "/config.yml"

