name: bidrag-dokument-arkivering
ingresses:
  - https://bidrag-dokument-arkivering.intern.dev.nav.no
env:
  BIDRAG_DOKUMENT_URL: https://bidrag-dokument.intern.dev.nav.no/bidrag-dokument
  DOKARKIV_URL: https://dokarkiv-q2.intern.dev.nav.no
  DOKARKIV_SCOPE: dev-fss.teamdokumenthandtering.dokarkiv
