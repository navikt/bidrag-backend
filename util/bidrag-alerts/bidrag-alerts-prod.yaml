apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    team: bidrag
  name: bidrag-alerts
  namespace: bidrag
spec:
  groups:
    - name: Applikasjoner er nede
      rules:
        - alert: Applikasjon nede
          expr: kube_deployment_status_replicas_available{namespace="bidrag",deployment!~"bidrag-bidragskalkulator-.*"} == 0
          for: 5m
          annotations:
            consequence: Applikasjon er nede
            action: "Kjør `kubectl get pod -n {{ $labels.namespace }}  | grep {{ $labels.deployment }}` for å se podder som er nede"
            summary: |-
              App {{ $labels.deployment }} er nede i prod
          labels:
            namespace: bidrag
            severity: critical
            bidrag_template_type: bidrag-template
            bidrag_template_type_fss: bidrag-template-fss
            sp_alert: sp-alert-bidrag # Statusplattform
            alert_type: custom # Statusplattform
            nav_service_id: 0dce0354-210d-45ab-85f0-11899dd6f484 #Statusplattform - Service id fra statusplattformen (se https://status.intern.dev.nav.no/sp/Admin?tab=Tjenester)
            nav_status: issue #Statusplattform - Feilstatus down|issue

    - name: Databasemetrikker
      rules:
        - alert: Høy bruk av databasekoblinger
          expr: max by (app, pod) ((hikaricp_connections_active{namespace="bidrag",app!=""} / hikaricp_connections_max{namespace="bidrag",app!=""}) * 100) > 85
          for: 10m
          annotations:
            consequence: "Appen er nær grensen for antall tilgjengelige databasekoblinger."
            action: "https://grafana.nav.cloud.nais.io/a/nais-apm-app/services/bidrag/{{ $labels.app }}?namespace=bidrag&environment=prod&traceSpan={{ $labels.app }}"
            summary: |-
              Appen {{ $labels.app }} har brukt over 85 % av tilgjengelige databasekoblinger i pod {{ $labels.pod }} over tid.
          labels:
            namespace: bidrag
            severity: warning

        - alert: Ventende databasekoblinger
          expr: max by (app, pod) (hikaricp_connections_pending{namespace="bidrag",app!=""}) >= 5
          for: 5m
          annotations:
            consequence: "Forespørsler venter på en ledig databasekobling."
            action: "https://grafana.nav.cloud.nais.io/a/nais-apm-app/services/bidrag/{{ $labels.app }}?namespace=bidrag&environment=prod&traceSpan={{ $labels.app }}"
            summary: |-
              Appen {{ $labels.app }} har minst 5 ventende databasekoblinger i pod {{ $labels.pod }}.
          labels:
            namespace: bidrag
            severity: warning

        - alert: Tidsavbrudd ved henting av databasekobling
          expr: sum by (app) (increase(hikaricp_connections_timeout_total{namespace="bidrag",app!=""}[10m])) > 0
          for: 0m
          annotations:
            consequence: "Appen har tapt forespørsler fordi den ikke fikk databasekobling i tide."
            action: "https://grafana.nav.cloud.nais.io/a/nais-apm-app/services/bidrag/{{ $labels.app }}?namespace=bidrag&environment=prod&traceSpan={{ $labels.app }}"
            summary: |-
              Appen {{ $labels.app }} har hatt tidsavbrudd ved henting av databasekoblinger de siste 10 minuttene.
          labels:
            namespace: bidrag
            severity: critical

        - alert: Gjentatte 5xx-responser på endepunkt
          expr: sum by (app, uri) (increase(http_server_requests_seconds_count{namespace="bidrag",app!="",uri!~"/actuator.*",status=~"5.."}[10m])) >= 5
          for: 5m
          annotations:
            consequence: "Brukere mottar gjentatte serverfeil fra et endepunkt."
            action: "https://grafana.nav.cloud.nais.io/a/nais-apm-app/services/bidrag/{{ $labels.app }}?namespace=bidrag&environment=prod&traceSpan={{ $labels.app }}"
            summary: |-
              Appen {{ $labels.app }} returnerer gjentatte 5xx-responser fra endepunktet {{ $labels.uri }}.
          labels:
            namespace: bidrag
            severity: critical

#    - name: Høy feilrate
