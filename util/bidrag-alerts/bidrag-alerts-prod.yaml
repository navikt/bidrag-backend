    repeatInterval: 1h

---
# Webhookkonfig for Statusplattform
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: bidrag
  namespace: bidrag
  labels:
    alertmanagerConfig: bidrag-status-webhook
    team: bidrag
spec:
  receivers:
    - name: status_proxy
      webhookConfigs:
        - url: 'https://promstatusproxy.intern.nav.no/alert'
  route:
    groupBy:
      - alertname
    matchers:
      - name: "sp_alert"
        matchType: "="
        value: "sp-alert-bidrag"
    groupInterval: 5m
    groupWait: 1m
    receiver: status_proxy
    repeatInterval: 1h
