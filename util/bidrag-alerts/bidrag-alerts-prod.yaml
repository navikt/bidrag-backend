---
# Webhookkonfig for tilpasset Slack-kanal prod-fss
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: bidrag-template-slack-fss
  namespace: bidrag
  labels:
    alertmanagerConfig: bidrag-template-slack-fss
spec:
  receivers:
    - name: bidrag-template-receiver
      slackConfigs:
        - apiURL:
            key: apiUrl
            name: slack-webhook
          channel: '#team-bidrag-monitorering'
          iconEmoji: ':alert:'
          username: 'Varsel prod-fss'
          sendResolved: true
          httpConfig:
            proxyURL: http://webproxy.nais:8088
          title: |-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          text: >-
            {{ range .Alerts }}
            {{ if or .Annotations.summary .Annotations.message }}
            {{ or .Annotations.summary .Annotations.message }}
            {{ println " " }}
            {{- end }}
            {{- if .Annotations.action }}
            • *action*: {{ .Annotations.action }} {{ println " " }}
            {{- end }}
            {{- if .Annotations.logs }}
            • {{ .Annotations.logs }}{{ println " " }}
            {{- end }}
            {{ end }}
  route:
    groupBy:
      - alertname
    matchers:
      - name: "bidrag_template_type_fss"
        matchType: "="
        value: "bidrag-template-fss"
    groupInterval: 5m
    groupWait: 1m
    receiver: bidrag-template-receiver
    repeatInterval: 1h

---
# Webhookkonfig for tilpasset Slack-kanal prod-gcp
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: bidrag-template-slack
  namespace: bidrag
  labels:
    alertmanagerConfig: bidrag-template-slack
spec:
  receivers:
    - name: bidrag-template-receiver
      slackConfigs:
        - apiURL:
            key: apiUrl
            name: slack-webhook
          channel: 'team-bidrag-monitorering'
          iconEmoji: ':alert:'
          username: 'Varsel prod-gcp'
          sendResolved: true
          title: |-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          text: >-
            {{ range .Alerts }}
            {{ if or .Annotations.summary .Annotations.message }}
            {{ or .Annotations.summary .Annotations.message }}
            {{ println " " }}
            {{- end }}
            {{- if .Annotations.action }}
            • *action*: {{ .Annotations.action }} {{ println " " }}
            {{- end }}
            {{- if .Annotations.logs }}
            • {{ .Annotations.logs }}{{ println " " }}
            {{- end }}
            {{ end }}
  route:
    groupBy:
      - alertname
    matchers:
      - name: "bidrag_template_type"
        matchType: "="
