spring:
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    properties:
      security.protocol: PLAINTEXT
    consumer:
      auto-offset-reset: earliest
      enableAutoCommit: false
    listener:
      ackMode: RECORD

no.nav.security.jwt:
  issuer.aad:
    discovery_url: ${DISCOVERY_URL}
    accepted_audience: aud-localhost
    proxy_url: #Default satt, skal være null i integrasjonstest

#    Noen brukere får ikke bygd lokalt med localhost-url, bytt i så fall med 127.0.0.1
#DISCOVERY_URL: http://127.0.0.1:${mock-oauth2-server.port}/aad/.well-known/openid-configuration
DISCOVERY_URL: http://localhost:${mock-oauth2-server.port}/aad/.well-known/openid-configuration


BIDRAG_PERSON_URL: https://dummy.nav.no/
BIDRAG_TILGANG_URL: https://dummy.nav.no/
BIDRAG_ORGANISASJON_URL: https://dummy.nav.no/
BIDRAG_SAMHANDLER_URL: https://dummy.nav.no/
AZURE_APP_WELL_KNOWN_URL: dummy
AZURE_OPENID_CONFIG_TOKEN_ENDPOINT: dummy
KAFKA_BROKERS: localhost:9093
TOPIC_SAK: bidrag.sak
NAIS_APP_NAME: ${spring.application.name}
