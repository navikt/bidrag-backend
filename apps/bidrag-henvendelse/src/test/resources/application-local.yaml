# Ikke-hemmelig konfigurasjon for lokal kjøring mot dev. Azure-credentials
# (AZURE_APP_TENANT_ID, AZURE_APP_CLIENT_ID, AZURE_APP_CLIENT_SECRET) må settes som
# miljøvariabler - se README.
HENVENDELSE_URL: https://sf-henvendelse.intern.dev.nav.no
HENVENDELSE_SCOPE: dev-gcp.teamnks.sf-henvendelse-api-proxy
BIDRAG_PERSON_URL: https://bidrag-person-q2.intern.dev.nav.no
BIDRAG_PERSON_SCOPE: dev-fss.bidrag.bidrag-person-q2

# IdUtils i bidrag-commons krever denne, uten default. Settes av Nais i miljøene, men må
# stå her for at appen skal starte lokalt.
NAIS_APP_NAME: bidrag-henvendelse-lokal
