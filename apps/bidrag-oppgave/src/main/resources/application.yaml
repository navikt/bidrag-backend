spring:
  application:
    name: bidrag-oppgave
  security:
    oauth2:
      # Validering av innkommende Azure AD-brukertoken
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_OPENID_CONFIG_ISSUER}
          audiences: ${AZURE_APP_CLIENT_ID}

springdoc:
  packages-to-scan: no.nav.bidrag.oppgave.controller
  swagger-ui:
    path: /
    display-request-duration: true
    try-it-out-enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /internal
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

