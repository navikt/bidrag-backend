spring:
  config.activate.on-profile: test, local, integration-abac
  datasource:
    url:  jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  h2:
    console:
      enabled: true
  jpa.hibernate.ddl-auto: create-drop
  kafka:
    properties:
      security.protocol: PLAINTEXT
    consumer:
      enableAutoCommit: false
    listener:
      ackMode: RECORD

