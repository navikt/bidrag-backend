# Vedleggene med opplysninger i bidragsnotatet.
# Endre bare teksten etter kolon. Navnet foran kolon brukes av malen og må ikke endres.
# {} og ord i {klammer} fylles ut med verdier og må stå.

underholdskostnader:
  tittel: "Vedlegg nr. {}: Underholdskostnader"
  barnetilsyn:
    tittel: "{}.1 Barnetilsyn"
    ingenOffentligBarnetilsyn: Ingen offentlig barnetilsyn
  tilleggsstønad:
    tittel: "{}.2 Tilleggsstønad"
