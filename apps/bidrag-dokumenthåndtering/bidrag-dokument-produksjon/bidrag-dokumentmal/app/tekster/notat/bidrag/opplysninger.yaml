  faktiskTilsynsutgifter:
    tittel: Faktisk Tilsynsutgifter
    beregning: ({totalTilsynsutgift} - {kostpenger}) x 11/12
  tilleggsstønadBeregning:
    tittel: Tilleggsstønad
    beregningDagsats: ({beløp} x 260) / 12 x 11 / 12
    beregning: "{beløp} x 11 / 12"
