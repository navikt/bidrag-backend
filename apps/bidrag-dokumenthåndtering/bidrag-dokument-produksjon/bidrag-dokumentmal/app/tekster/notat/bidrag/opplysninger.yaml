    andelSøknadsbarnBeregning: "{bruttoTilsynsutgift} / {sumTilsynsutgifter} = {fordelingFaktor}"
  skattefradrag:
    tittel: Skattefradrag
    maksFradrag: Maks fradrag
    maksFradragBeregning: "{sjablonMaksFradrag} x {skattesats}"
