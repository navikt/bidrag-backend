    ingenAndreBarn: Bidragsmottaker har ingen andre barn
  beregningsdetaljer:
    tittel: "{}.4 Beregningsdetaljer tilsynsutgifter"
    ingenBeregningsdetaljer: Ingen beregningsdetaljer
    antallBarnUnderTolvÅr: Antall barn under 12 år
    antallBarnMedTilsynsutgifter: Antall barn med tilsynsutgifter
    antallBarnOverTolvÅrMedTilsynsutgifter: Antall barn over 12 år med tilsynsutgifter
