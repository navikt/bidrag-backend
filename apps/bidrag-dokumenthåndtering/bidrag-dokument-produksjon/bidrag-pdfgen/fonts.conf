<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- style.css refers to the legacy "Source Sans Pro" name for h1/p while the
       rest of the document uses "Source Sans 3". Only Source Sans 3 is
       installed, so alias the old name onto it; without this those elements
       silently fall back to DejaVu Sans and look different from everything else. -->
  <alias binding="same">
    <family>Source Sans Pro</family>
    <accept><family>Source Sans 3</family></accept>
  </alias>

  <!-- Generic families, so unknown glyphs render as text rather than tofu. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Source Sans 3</family>
      <family>DejaVu Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
