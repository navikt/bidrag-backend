spring.devtools.add-properties: false
spring.main.banner-mode: off
spring.favicon.enabled: false
management:
  endpoints.web:
    exposure.include: info, health, metrics, prometheus
    base-path: /internal/actuator
  endpoint.health.show-details: always

# Default env var vaules (overrided by env-variable in Vault)
bidrag.dokument.url: ${BIDRAG_DOKUMENT_URL}

dokarkiv.journalpostapi.v1.url: ${DOKARKIV_URL}

springdoc:
  packages-to-scan: no.nav.bidrag.dokument.arkivering.controller

####################################################################
#
# Properties for configuring OIDC from OpenAM
#
####################################################################
---

spring.config.activate.on-profile: live

no.nav.security.jwt:
  client:
    registration:
      bidrag-dokument:
        token-endpoint-url: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/oauth2/v2.0/token
        grant-type: urn:ietf:params:oauth:grant-type:jwt-bearer
        scope: api://${BIDRAG_DOKUMENT_SCOPE}/.default
        authentication:
          client-id: ${AZURE_APP_CLIENT_ID}
          client-secret: ${AZURE_APP_CLIENT_SECRET}
          client-auth-method: client_secret_basic
      dokarkiv:
        token-endpoint-url: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/oauth2/v2.0/token
        grant-type: urn:ietf:params:oauth:grant-type:jwt-bearer
        scope: api://${DOKARKIV_SCOPE}/.default
        authentication:
          client-id: ${AZURE_APP_CLIENT_ID}
          client-secret: ${AZURE_APP_CLIENT_SECRET}
          client-auth-method: client_secret_basic
  issuer:
    aad:
      discovery_url: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0/.well-known/openid-configuration
      accepted_audience: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
