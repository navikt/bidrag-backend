kafka:
  clusters:
    - name: nais
      bootstrap-servers: ${KAFKA_BROKERS}
      ssl:
        truststore-location: ${KAFKA_TRUSTSTORE_PATH}
        truststore-password: ${KAFKA_CREDSTORE_PASSWORD}
        verify-ssl: false  # Enable SSL certificate verification
      properties:
        "security.protocol": SSL
        "ssl.keystore.type": PKCS12
        "ssl.keystore.location": ${KAFKA_KEYSTORE_PATH}
        "ssl.keystore.password": ${KAFKA_CREDSTORE_PASSWORD}
webclient:
  max-in-memory-buffer-size: 50MB
management:
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "info,health,prometheus"