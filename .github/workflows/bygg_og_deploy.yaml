name: Bygg og deploy
on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: 25
        description: Hvilken versjon av java applikasjonen skal bygges med
      runner:
        required: false
        type: string
        default: ubuntu-latest
        description: >-
          Runner build-jobben skal kjøre på. Kan settes til en større GitHub-hosted
          runner (f.eks. ubuntu-latest-4-cores eller ubuntu-latest-8-cores) for tyngre
          Maven/Docker-bygg.
      nais_cluster:
        required: false
        type: string
        default: gcp
        description: Nais cluster som applikasjonen skal deployes til. Skal enten være 'gcp' eller 'fss'
      nais_hovedfil_navn:
        required: false
        type: string
        default: nais.yaml
        description: Navnet på nais filen som skal brukes. Parameter skal inkludere filending og evt path om det ikke ligger på root i .nais folder.
      nais_variabler_filnavn_q1:
        required: false
        type: string
        description: Navnet på miljøvariabler-filen for q1. Kun nødvendig når `deploy_q1` kan bli true.
      nais_variabler_filnavn_q2:
        required: false
        type: string
        description: Navnet på miljøvariabler-filen for q2. Kun nødvendig når `deploy_q2` kan bli true.
      nais_variabler_filnavn_prod:
        required: false
        type: string
        default: prod.yaml
        description: Navnet på miljøvariabler-filen for prod. Kun nødvendig når `deploy_prod` kan bli true.
      deploy_q1:
        required: false
        type: boolean
        default: false
        description: Om denne kjøringen skal deploye til q1 (etter en vellykket bygg+test).
      deploy_q2:
        required: false
        type: boolean
        default: false
        description: Om denne kjøringen skal deploye til q2 (etter en vellykket bygg+test).
      deploy_prod:
        required: false
        type: boolean
        default: false
        description: Om denne kjøringen skal deploye til prod (etter en vellykket bygg+test), samt tagge en utgivelse.
      skip_tester:
        required: false
        type: boolean
        default: false
        description: >-
          Hopp over tester og ktlint for å tvinge gjennom en deploy,
          f.eks. for å teste en ellers rød branch i q1/q2. Kun tillatt sammen
          med deploy_q1/deploy_q2 - jobben feiler eksplisitt hvis dette
          kombineres med deploy_prod.
      maven_options:
        required: false
        type: string
        default: -B -fae
        description: Maven-argumenter med -pl for appmodulen. Bibliotekene bygges via -am.
      maven_cache_paths:
        required: false
        type: string
        default: "**/pom.xml"
        description: pom.xml-filer (én per linje) som utgjør avhengighetstreet for denne appen (rot-pom.xml + evt. parent-aggregator + appens egen pom.xml). Brukes til å lage en presis Maven-cache-nøkkel istedenfor å hashe alle pom.xml i monorepoet. Default hasher alle.
      maven_cache_key:
        required: false
        type: string
        description: Unik nøkkel-prefiks for Maven-cachen til denne appen. Faller tilbake til image_suffix om ikke satt.
      ktlint_paths:
        required: false
        type: string
        default: src/**/*.kt
        description: Filer som skal sjekkes med ktlint, relativt til roten av repoet. Endrede biblioteker sjekkes separat.
      ktlint_version:
        required: false
        type: string
        default: "1.8.0"
        description: Versjon av ktlint-CLI som skal brukes. Må holdes i sync med <ktlint.version> i rot-pom.xml.
      dockerfile_with_path:
        required: false
        type: string
        default: Dockerfile
        description: Kan settes for å spesifisere path for dockerfile.
      docker_context:
        required: false
        type: string
        default: .
        description: Kan settes for å spesifisere docker context for build files.
      image_suffix:
        required: false
        type: string
        description: Suffix for docker image om det er multimodul repo.
      tag:
        required: false
        type: string
        description: Custom docker tag
    outputs:
      image:
        description: "Docker Image navnet som ble bygget og deployet"
        value: ${{ jobs.bygg_test_og_image.outputs.image }}
      tag:
        description: "Docker tag som ble bygget og deployet"
        value: ${{ jobs.bygg_test_og_image.outputs.tag }}
      digest:
        description: "Docker image digest"
        value: ${{ jobs.bygg_test_og_image.outputs.digest }}

jobs:
  # Bygger og sjekker Docker-image også på PR-er. Ved deploy attesteres imaget før jobben fullfører.
  bygg_test_og_image:
    name: Bygg og attester image
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      # skip_tester lar en dispatch-kjøring tvinge gjennom en deploy uten at
      # tester/ktlint kjører. Kun ment for q1/q2. Stopper derfor jobben eksplisitt hvis
      # den noen gang kombineres med deploy_prod, og varsler tydelig ellers slik at
      # det er sporbart hvem som brukte den og når.
      - name: Sperre skip_tester mot prod
        if: inputs.skip_tester && inputs.deploy_prod
        run: |
          echo "::error::skip_tester kan ikke kombineres med deploy_prod - dette er kun for q1/q2."
          exit 1
      - name: Varsle at tester/ktlint hoppes over
        if: inputs.skip_tester
        run: echo "::warning::Deploy tvinges gjennom av ${{ github.actor }} med tester og ktlint hoppet over (skip_tester=true)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
      # Egen, smal cache-nøkkel (kun denne appens pom-kjede via maven_cache_paths) istedenfor
      # innebygd `cache: maven`, som hasher **alle** pom.xml i monorepoet og dermed invalideres
      # av endringer i moduler denne jobben ikke bygger.
      # Kun restore her; cachen lagres bare fra main (se "Lagre Maven-cache"). PR-brancher får da
      # ikke egne kopier som fyller opp repoets cache-kvote og fortrenger main-cachene.
      # Interne biblioteker bygges fra samme checkout med -am, ikke fra Maven-cachen.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: maven-cache
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/no/nav/bidrag
          key: maven-${{ inputs.maven_cache_key || inputs.image_suffix || 'default' }}-${{ hashFiles(inputs.maven_cache_paths) }}
          restore-keys: |
            maven-${{ inputs.maven_cache_key || inputs.image_suffix || 'default' }}-
      - uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          # githubServer: false - vi definerer selv en "github"-server under, actionen
          # legger ellers automatisk til en egen "github"-server (med GITHUB_TOKEN),
          # som kolliderer med vår og gir "duplicate server with id github".
          githubServer: false
          servers: |
            [
              {
                "id": "github",
                "username": "x-access-token",
                "password": "${{secrets.READER_TOKEN}}"
              },
              {
                "id": "github2",
                "username": "x-access-token",
                "password": "${{secrets.READER_TOKEN}}"
              }
            ]
      - name: Bygg app og avhengigheter uten tester
        env:
          MAVEN_OPTIONS: ${{ inputs.maven_options }}
        run: |
          read -r -a options <<< "$MAVEN_OPTIONS"
          mvn -T 1C -nsu -Dmaven.artifact.threads=16 "${options[@]}" -am clean verify -Dmaven.test.skip=true -Dmaven.antrun.skip=true
      - name: Lagre Maven-cache
        if: always() && github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/no/nav/bidrag
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}
      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        if: github.actor != 'dependabot[bot]' && github.event_name != 'merge_group'
        id: docker-push
        env:
          TRIVY_JAVA_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-java-db:1"
        with:
          team: bidrag
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: ${{ inputs.dockerfile_with_path }}
          docker_context: ${{ inputs.docker_context }}
          image_suffix: ${{ inputs.image_suffix }}
          tag: ${{ inputs.tag }}
          salsa: true
          push_image: ${{ inputs.deploy_q1 || inputs.deploy_q2 || inputs.deploy_prod }}
          no_cache: true
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      tag: ${{ steps.docker-push.outputs.tag }}
      digest: ${{ steps.docker-push.outputs.digest }}

  tester:
    name: Kjør tester og ktlint
    if: ${{ !inputs.skip_tester }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: "read"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
      - name: Finn endrede biblioteker ved manuell kjøring
        if: github.event_name == 'workflow_dispatch'
        id: biblioteker
        run: python3 .github/scripts/finn_berorte_apper.py --biblioteker
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/no/nav/bidrag
          key: maven-${{ inputs.maven_cache_key || inputs.image_suffix || 'default' }}-${{ hashFiles(inputs.maven_cache_paths) }}
          restore-keys: |
            maven-${{ inputs.maven_cache_key || inputs.image_suffix || 'default' }}-
      - uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: |
            [
              {
                "id": "github",
                "username": "x-access-token",
                "password": "${{secrets.READER_TOKEN}}"
              },
              {
                "id": "github2",
                "username": "x-access-token",
                "password": "${{secrets.READER_TOKEN}}"
              }
            ]
      - name: Test endrede biblioteker ved manuell kjøring
        if: github.event_name == 'workflow_dispatch' && steps.biblioteker.outputs.biblioteker != '[]'
        env:
          BIBLIOTEKER: ${{ steps.biblioteker.outputs.biblioteker }}
        run: |
          prosjekter="$(python3 -c 'import json, os; print(",".join(json.loads(os.environ["BIBLIOTEKER"])))')"
          mvn -B -T 1C -nsu -pl "$prosjekter" -am -Dmaven.test.skip=true -Dmaven.antrun.skip=true install
          mvn -B -T 1C -nsu -pl "$prosjekter" clean verify
      - name: Cache ktlint CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/ktlint
          key: ktlint-cli-${{ inputs.ktlint_version }}
      - name: Verifiser formatering med ktlint
        env:
          KTLINT_VERSION: ${{ inputs.ktlint_version }}
          KTLINT_PATHS: ${{ inputs.ktlint_paths }}
        run: |
          if [ ! -x ~/.local/bin/ktlint ]; then
            mkdir -p ~/.local/bin
            curl -fsSL -o ~/.local/bin/ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
            chmod +x ~/.local/bin/ktlint
          fi
          read -r -a paths <<< "$KTLINT_PATHS"
          ~/.local/bin/ktlint "${paths[@]}"
      - name: Bygg og kjør tester
        env:
          MAVEN_OPTIONS: ${{ inputs.maven_options }}
        run: |
          read -r -a options <<< "$MAVEN_OPTIONS"
          mvn -T 1C -nsu -Dmaven.artifact.threads=16 "${options[@]}" -am -Dmaven.test.skip=true -Dmaven.antrun.skip=true install
          mvn -T 1C -nsu -Dmaven.artifact.threads=16 "${options[@]}" clean verify -Dmaven.antrun.skip=true

  # Deploy venter på både tester og et ferdig attestert image.
  deploy_q1:
    name: Deploy til q1
    needs: [bygg_test_og_image, tester]
    if: >-
      ${{ !cancelled() && inputs.deploy_q1 &&
          needs.bygg_test_og_image.result == 'success' &&
          (needs.tester.result == 'success' || (inputs.skip_tester && needs.tester.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    concurrency:
      group: deploy-${{ inputs.image_suffix || inputs.tag || github.workflow }}-q1
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy to dev-${{ inputs.nais_cluster }} med ${{ inputs.nais_variabler_filnavn_q1 }}
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: dev-${{ inputs.nais_cluster }}
          RESOURCE: .nais/${{ inputs.nais_hovedfil_navn }}
          VARS: .nais/${{ inputs.nais_variabler_filnavn_q1 }}
          IMAGE: ${{ needs.bygg_test_og_image.outputs.image }}

  deploy_q2:
    name: Deploy til q2
    needs: [bygg_test_og_image, tester]
    if: >-
      ${{ !cancelled() && inputs.deploy_q2 &&
          needs.bygg_test_og_image.result == 'success' &&
          (needs.tester.result == 'success' || (inputs.skip_tester && needs.tester.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    concurrency:
      group: deploy-${{ inputs.image_suffix || inputs.tag || github.workflow }}-q2
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy to dev-${{ inputs.nais_cluster }} med ${{ inputs.nais_variabler_filnavn_q2 }}
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: dev-${{ inputs.nais_cluster }}
          RESOURCE: .nais/${{ inputs.nais_hovedfil_navn }}
          VARS: .nais/${{ inputs.nais_variabler_filnavn_q2 }}
          IMAGE: ${{ needs.bygg_test_og_image.outputs.image }}

  deploy_prod:
    name: Deploy til prod
    needs: [bygg_test_og_image, tester]
    if: >-
      ${{ !cancelled() && inputs.deploy_prod &&
          needs.bygg_test_og_image.result == 'success' &&
          needs.tester.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    concurrency:
      group: deploy-${{ inputs.image_suffix || inputs.tag || github.workflow }}-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy to prod-${{ inputs.nais_cluster }} med ${{ inputs.nais_variabler_filnavn_prod }}
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: prod-${{ inputs.nais_cluster }}
          RESOURCE: .nais/${{ inputs.nais_hovedfil_navn }}
          VARS: .nais/${{ inputs.nais_variabler_filnavn_prod }}
          IMAGE: ${{ needs.bygg_test_og_image.outputs.image }}

  tag_utgivelse:
    name: "Tag utgivelse"
    needs: [ bygg_test_og_image, deploy_prod ]
    if: inputs.deploy_prod
    permissions:
      contents: "write"
    uses: ./.github/workflows/tag_utgivelse.yaml
    with:
      tag: ${{ needs.bygg_test_og_image.outputs.tag }}
      app_navn: ${{ inputs.tag }}
    secrets: inherit
