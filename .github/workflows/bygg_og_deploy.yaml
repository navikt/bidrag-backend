name: Bygg og deploy
on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: 21
        description: Hvilken versjon av java applikasjonen skal bygges med
      runner:
        required: false
        type: string
        default: ubuntu-latest
        description: >-
          Runner build-jobben skal kjøre på. Kan settes til en større GitHub-hosted
          runner (f.eks. ubuntu-latest-4-cores eller ubuntu-latest-8-cores) for tyngre
          Maven/Docker-bygg.
      nais_cluster:
        required: false
        type: string
        default: gcp
        description: Nais cluster som applikasjonen skal deployes til. Skal enten være 'gcp' eller 'fss'
      nais_hovedfil_navn:
        required: false
        type: string
        default: nais.yaml
        description: Navnet på nais filen som skal brukes. Parameter skal inkludere filending og evt path om det ikke ligger på root i .nais folder.
      nais_variabler_filnavn_q1:
        required: false
        type: string
        description: Navnet på miljøvariabler-filen for q1. Kun nødvendig når `deploy_q1` kan bli true.
      nais_variabler_filnavn_q2:
        required: false
        type: string
        description: Navnet på miljøvariabler-filen for q2. Kun nødvendig når `deploy_q2` kan bli true.
      nais_variabler_filnavn_prod:
        required: false
        type: string
        default: prod.yaml
        description: Navnet på miljøvariabler-filen for prod. Kun nødvendig når `deploy_prod` kan bli true.
      deploy_q1:
        required: false
        type: boolean
        default: false
        description: Om denne kjøringen skal deploye til q1 (etter en vellykket bygg+test).
      deploy_q2:
        required: false
        type: boolean
        default: false
        description: Om denne kjøringen skal deploye til q2 (etter en vellykket bygg+test).
      deploy_prod:
        required: false
        type: boolean
        default: false
        description: Om denne kjøringen skal deploye til prod (etter en vellykket bygg+test), samt tagge en utgivelse.
      maven_options:
        required: false
        type: string
        default: -B -fae
        description: Ekstra options ved kjøring av maven bygget. Dette kan være lag eller profiler. Default -B (Batchmode, non-interactive), -fae (Fail at end).
      maven_cache_paths:
        required: false
        type: string
        default: "**/pom.xml"
        description: pom.xml-filer (én per linje) som utgjør avhengighetstreet for denne appen (rot-pom.xml + evt. parent-aggregator + appens egen pom.xml). Brukes til å lage en presis Maven-cache-nøkkel istedenfor å hashe alle pom.xml i monorepoet. Default hasher alle.
      maven_cache_key:
        required: false
        type: string
        description: Unik nøkkel-prefiks for Maven-cachen til denne appen. Faller tilbake til image_suffix om ikke satt.
      ktlint_paths:
        required: false
        type: string
        default: src/**/*.kt
        description: Path relativt til repo-rot hvor ktlint skal kjøre, f.eks. "apps/bidrag-oppgave/src/**/*.kt libs/bidrag-oppgave-dto/src/**/*.kt".
      ktlint_version:
        required: false
        type: string
        default: "1.8.0"
        description: Versjon av ktlint-CLI som skal brukes. Må holdes i sync med <ktlint.version> i rot-pom.xml.
      dockerfile_with_path:
        required: false
        type: string
        default: Dockerfile
        description: Kan settes for å spesifisere path for dockerfile.
      docker_context:
        required: false
        type: string
        default: .
        description: Kan settes for å spesifisere docker context for build files.
      image_suffix:
        required: false
        type: string
        description: Suffix for docker image om det er multimodul repo.
      tag:
        required: false
        type: string
        description: Custom docker tag
    outputs:
      image:
        description: "Docker Image navnet som ble bygget og deployet"
        value: ${{ jobs.bygg_test_og_image.outputs.image }}
      tag:
        description: "Docker tag som ble bygget og deployet"
        value: ${{ jobs.bygg_test_og_image.outputs.tag }}
      digest:
        description: "Docker image digest"
        value: ${{ jobs.bygg_test_og_image.outputs.digest }}

env:
  # De 5 bidrag-felles-modulene som (nesten) alle app-moduler avhenger av med
  # ${project.version} (SNAPSHOT, aldri reelt publisert). Uten dette måtte hver av de
  # 32 app-pipelinene kompilert (og delvis testet) disse fra kildekode på nytt via
  # `-pl app -am`, uansett om bidrag-felles faktisk var endret. Nå caches ferdig
  # installerte jar-er på tvers av alle app-workflows, nøkkelet på innholdet i
  # libs/bidrag-felles/**, og bygges kun på nytt når det innholdet faktisk endres.
  FELLES_MODULER: >-
    libs/bidrag-felles/bidrag-domene,libs/bidrag-felles/bidrag-transport,libs/bidrag-felles/bidrag-commons,libs/bidrag-felles/bidrag-commons-test,libs/bidrag-felles/bidrag-generer-testdata

jobs:
  # Bygger, kjører tester og lager Docker-image. Kjører uansett om det skal deploye eller ikke, slik at
  # PR-er alltid får bygg+test-feedback.
  bygg_test_og_image:
    name: Bygg, test og lag image
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
      # Egen, smal cache-nøkkel (kun denne appens pom-kjede via maven_cache_paths) istedenfor
      # innebygd `cache: maven`, som hasher **alle** pom.xml i monorepoet og dermed invalideres
      # av endringer i moduler denne jobben ikke bygger.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ inputs.maven_cache_key || inputs.image_suffix || 'default' }}-${{ hashFiles(inputs.maven_cache_paths) }}
          restore-keys: |
            maven-${{ inputs.maven_cache_key || inputs.image_suffix || 'default' }}-
      - uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        with:
          # githubServer: false - vi definerer selv en "github"-server under, actionen
          # legger ellers automatisk til en egen "github"-server (med GITHUB_TOKEN),
          # som kolliderer med vår og gir "duplicate server with id github".
          githubServer: false
          servers: |
            [
              {
                "id": "github",
                "username": "x-access-token",
                "password": "${{secrets.READER_TOKEN}}"
              },
              {
                "id": "github2",
                "username": "x-access-token",
                "password": "${{secrets.READER_TOKEN}}"
              }
            ]
      # Delt cache for de ferdig installerte bidrag-felles-artefaktene, nøkkelet på
      # innholdet i libs/bidrag-felles/** uavhengig av hvilken app som bygges. Denne
      # cachen gjenbrukes på tvers av alle workflows, slik at bidrag-felles kun
      # bygges fra kildekode når den faktisk endres.
      - name: Gjenopprett cache for bidrag-felles-artefakter
        id: felles_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository/no/nav/bidrag/bidrag-domene-felles
            ~/.m2/repository/no/nav/bidrag/bidrag-transport-felles
            ~/.m2/repository/no/nav/bidrag/bidrag-commons-felles
            ~/.m2/repository/no/nav/bidrag/bidrag-commons-test-felles
            ~/.m2/repository/no/nav/bidrag/bidrag-generer-testdata-felles
          key: felles-m2-${{ hashFiles('libs/bidrag-felles/**') }}
      # Bygger, installerer og tester bidrag-felles-modulene i det lokale Maven-repoet
      # ved cache-miss Merk: siden alle app-workflows som avhenger av
      # bidrag-felles trigges av samme push når libs/bidrag-felles/** endres, vil flere
      # av dem kunne cache-misse og bygge+teste felles samtidig. De neste urelaterte
      # app-pushene vil deretter treffe den nå varme cachen.
      - name: Installer bidrag-felles i lokalt repo (kun ved cache-miss)
        if: steps.felles_cache.outputs.cache-hit != 'true'
        run: mvn -B -q -T 1C -pl ${{ env.FELLES_MODULER }} -am install
      # Kjører ktlint direkte via CLI (ikke via Maven). Dette unngår at multi-modul-reactoren
      # må kompilere og at direkte plugin-goal-kall (f.eks. `mvn antrun:run@ktlint`)
      # feiler for moduler med interne avhengigheter
      - name: Cache ktlint CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/ktlint
          key: ktlint-cli-${{ inputs.ktlint_version }}
      - name: Verifiser formatering med ktlint
        run: |
          if [ ! -x ~/.local/bin/ktlint ]; then
            mkdir -p ~/.local/bin
            curl -sSL -o ~/.local/bin/ktlint "https://github.com/pinterest/ktlint/releases/download/${{ inputs.ktlint_version }}/ktlint"
            chmod +x ~/.local/bin/ktlint
          fi
          ~/.local/bin/ktlint ${{ inputs.ktlint_paths }}
      - name: Bygg og kjør tester
        # -Dmaven.antrun.skip=true: hopper over ktlint-antrun-executionen som er bundet til
        # `verify`-fasen i rot-pom.xml. Den er allerede dekket av CLI-steget over, og
        # maven-antrun-plugin brukes kun til ktlint, så skip her påvirker ikke andre antrun-mål.
        run: mvn -T 1C ${{ inputs.maven_options }} clean verify -Dmaven.antrun.skip=true
      - uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # v0
        if: github.actor != 'dependabot[bot]'
        id: docker-push
        env:
          TRIVY_JAVA_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-java-db:1"
        with:
          team: bidrag
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: ${{ inputs.dockerfile_with_path }}
          docker_context: ${{ inputs.docker_context }}
          image_suffix: ${{ inputs.image_suffix }}
          tag: ${{ inputs.tag }}
          salsa: false
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      tag: ${{ steps.docker-push.outputs.tag }}
      digest: ${{ steps.docker-push.outputs.digest }}

  salsa:
    name: Generate SBOM, attest and sign image
    needs: bygg_test_og_image
    runs-on: ubuntu-latest
    permissions:
      id-token: "write"
    steps:
      - name: NAIS login
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        id: login
        with:
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          team: bidrag
      - id: setup
        shell: bash
        run: |
          suffix="${{ inputs.image_suffix }}"
          suffix=${suffix:+-$suffix} # Ensure we only add a dash if suffix is set
          repo_name="${GITHUB_REPOSITORY/$GITHUB_REPOSITORY_OWNER\//}$suffix"
          repo_name="$(tr '[:upper:]' '[:lower:]' <<< "$repo_name")"
          echo "REPO_NAME=$repo_name" >> $GITHUB_OUTPUT
      - name: Generate SBOM, attest and sign image
        id: attest-sign
        uses: nais/attest-sign@65d1aaa8b7dc5913ae02b80f16f7c1cf9bad6491 # v2.0.17
        with:
          image_ref: ${{ steps.login.outputs.registry }}/${{ steps.setup.outputs.REPO_NAME }}@${{ needs.bygg_test_og_image.outputs.digest }}
    outputs:
        description: "SBOM.json in cyclonedx format"
        value: ${{ steps.attest-sign.outputs.sbom }}

  # De tre deploy-jobbene under trenger alle et vellykket bygg,
  # og kjører kun når kalleren faktisk ber om det aktuelle miljøet (deploy_q1/q2/prod-input).
  deploy_q1:
    name: Deploy til q1
    needs: bygg_test_og_image
    if: inputs.deploy_q1
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    concurrency:
      group: deploy-${{ github.workflow }}-q1
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy to dev-${{ inputs.nais_cluster }} med ${{ inputs.nais_variabler_filnavn_q1 }}
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: dev-${{ inputs.nais_cluster }}
          RESOURCE: .nais/${{ inputs.nais_hovedfil_navn }}
          VARS: .nais/${{ inputs.nais_variabler_filnavn_q1 }}
          IMAGE: ${{ needs.bygg_test_og_image.outputs.image }}

  deploy_q2:
    name: Deploy til q2
    needs: bygg_test_og_image
    if: inputs.deploy_q2
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    concurrency:
      group: deploy-${{ github.workflow }}-q2
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy to dev-${{ inputs.nais_cluster }} med ${{ inputs.nais_variabler_filnavn_q2 }}
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: dev-${{ inputs.nais_cluster }}
          RESOURCE: .nais/${{ inputs.nais_hovedfil_navn }}
          VARS: .nais/${{ inputs.nais_variabler_filnavn_q2 }}
          IMAGE: ${{ needs.bygg_test_og_image.outputs.image }}

  deploy_prod:
    name: Deploy til prod
    needs: bygg_test_og_image
    if: inputs.deploy_prod
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    concurrency:
      group: deploy-${{ github.workflow }}-prod
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy to prod-${{ inputs.nais_cluster }} med ${{ inputs.nais_variabler_filnavn_prod }}
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: prod-${{ inputs.nais_cluster }}
          RESOURCE: .nais/${{ inputs.nais_hovedfil_navn }}
          VARS: .nais/${{ inputs.nais_variabler_filnavn_prod }}
          IMAGE: ${{ needs.bygg_test_og_image.outputs.image }}

  tag_utgivelse:
    name: "Tag utgivelse"
    needs: [ bygg_test_og_image, deploy_prod ]
    if: inputs.deploy_prod
    permissions:
      contents: "write"
    uses: ./.github/workflows/tag_utgivelse.yaml
    with:
      tag: ${{ needs.bygg_test_og_image.outputs.tag }}
      app_navn: ${{ inputs.tag }}
    secrets: inherit
