name: Bygg og deploy apper
on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'apps/**'
      - 'libs/**'
      - '.nais/**'
      - '.github/**'
      - '.editorconfig'
  pull_request:
    paths:
      - 'pom.xml'
      - 'apps/**'
      - 'libs/**'
      - '.nais/**'
      - '.github/**'
      - '.editorconfig'

permissions:
  contents: read

jobs:
  detect_changes:
    name: Finn berørte apper
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.appvalg.outputs.apps }}
      bibliotekgrupper: ${{ steps.appvalg.outputs.bibliotekgrupper }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer YAML-parser
        run: python3 -m pip install --quiet --disable-pip-version-check PyYAML==6.0.3
      - name: Kjør tester for CI-skriptene
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          bash .github/scripts/test-pr-endringsoversikt.sh
      - name: Finn apper som må bygges
        id: appvalg
        run: python3 .github/scripts/finn_berorte_apper.py

  biblioteker:
    name: Klargjør biblioteker
    needs: detect_changes
    if: needs.detect_changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artefaktnavn: ${{ steps.artefakt.outputs.navn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-bibliotek-avhengigheter-${{ hashFiles('pom.xml', 'libs/**/pom.xml') }}
          restore-keys: |
            maven-bibliotek-avhengigheter-
      - uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        with:
          githubServer: false
          servers: |
            [
              {"id": "github", "username": "x-access-token", "password": "${{ secrets.READER_TOKEN }}"},
              {"id": "github2", "username": "x-access-token", "password": "${{ secrets.READER_TOKEN }}"}
            ]
      - uses: ./.github/actions/klargjor-biblioteker
        with:
          grupper: ${{ needs.detect_changes.outputs.bibliotekgrupper }}
      - name: Sett artefaktnavn for denne kjøringen
        id: artefakt
        run: echo "navn=biblioteker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Del ferdige biblioteker med appjobbene
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artefakt.outputs.navn }}
          path: |
            ~/.m2/repository/no/nav/bidrag/bidrag-backend
            ~/.m2/repository/no/nav/bidrag/bidrag-backend-*
            ~/.m2/repository/no/nav/bidrag/bidrag-beregn-*
            ~/.m2/repository/no/nav/bidrag/bidrag-oppgave-client
            ~/.m2/repository/no/nav/bidrag/bidrag-oppgave-dto
            ~/.m2/repository/no/nav/bidrag/bidrag-admin
            ~/.m2/repository/no/nav/bidrag/bidrag-dokumenthandtering
          if-no-files-found: error
          retention-days: 14

  bidrag-admin-fss:
    name: Bidrag-admin-fss
    needs: [detect_changes, biblioteker]
    if: contains(fromJSON(needs.detect_changes.outputs.apps), 'bidrag-admin-fss')
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/bidrag-admin-fss.yaml
    secrets: inherit
    with:
      bibliotekartefakt: ${{ needs.biblioteker.outputs.artefaktnavn }}

