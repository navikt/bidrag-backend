name: Sjekk sync med main
on:
  workflow_call:

jobs:
  sjekk_sync_med_main:
    name: "Verifiser at branch er i sync med main"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Sjekk at main er inkludert i branchen
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Branchen er ikke i sync med main. Merge/rebase main inn i branchen før du deployer til Q1/Q2."
            exit 1
          fi
