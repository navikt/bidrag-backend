name: Libs - bygg og test

on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    paths:
      - 'libs/**'

jobs:
  bygg_og_test:
    name: "Bygg og test alle moduler"
    runs-on: ubuntu-latest-8-cores
    concurrency:
      group: libs-bygg-test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: "read"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        with:
          # githubServer: false - vi definerer selv en "github"-server under, actionen
          # legger ellers automatisk til en egen "github"-server (med GITHUB_TOKEN),
          # som kolliderer med vår og gir "duplicate server with id github".
          githubServer: false
          servers: |
            [
              {
                "id": "github",
                "username": "x-access-token",
                "password": "${{ secrets.READER_TOKEN }}"
              }
            ]
      - name: Bygg og test alle moduler
        run: mvn -B -q -fae -T 1C verify
