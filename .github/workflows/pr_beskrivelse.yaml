name: PR-beskrivelse
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: pr-beskrivelse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: "read"

env:
  # Copilot CLI bruker modellnavn uten leverandørprefiks.
  MODELL: gpt-4.1
  MAKS_DIFF_TEGN: "60000"

jobs:
  beskriv_endringer:
    # Fork-PR-er får et read-only token og kan ikke oppdatere beskrivelsen.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: "Oppdater PR-beskrivelse med endringsoversikt"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      pull-requests: "write"
      copilot-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Sett arbeidskatalog
        # runner-konteksten er kun tilgjengelig på steg-nivå, så variabelen
        # eksporteres via GITHUB_ENV for å kunne brukes i resten av jobben.
        run: echo "ARBEIDSKATALOG=$RUNNER_TEMP/pr-beskrivelse" >> "$GITHUB_ENV"

      - name: Kjør tester for hjelpeskriptene
        run: |
          bash .github/scripts/test-pr-endringsoversikt.sh
          python3 .github/scripts/test_oppdater_pr_beskrivelse.py

      - name: Bygg endringsoversikt
        run: |
          git fetch origin "$BASE_BRANCH" --quiet
          BASE_SHA="$(git merge-base "origin/$BASE_BRANCH" HEAD)"
          echo "Sammenligner $BASE_SHA..${{ github.event.pull_request.head.sha }}"
          .github/scripts/pr-endringsoversikt.sh \
            "$BASE_SHA" \
            "${{ github.event.pull_request.head.sha }}" \
            "$ARBEIDSKATALOG"
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

      - name: Lag prompt
        run: |
          {
            echo "Tittel på pull requesten: $PR_TITTEL"
            echo
            echo "Berørte moduler:"
            cat "$ARBEIDSKATALOG/tabell.md"
            echo
            echo "Diff:"
            echo '```diff'
            cat "$ARBEIDSKATALOG/diff.txt"
            echo '```'
          } > "$ARBEIDSKATALOG/prompt.txt"
        env:
          PR_TITTEL: ${{ github.event.pull_request.title }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Installer Copilot CLI
        run: npm install -g @github/copilot

      - name: Generer sammendrag
        id: sammendrag
        # Et feilende sammendrag skal ikke blokkere PR-en; tabellen legges inn
        # uansett i steget under. Dette fanger blant annet at org-policyen
        # "Allow use of Copilot CLI billed to the organization" er slått av.
        continue-on-error: true
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        with:
          model: ${{ env.MODELL }}
          prompt-file: ${{ env.ARBEIDSKATALOG }}/prompt.txt
          system-prompt: |
            Du er en erfaren utvikler som skriver sammendrag av pull requests
            i monorepoet bidrag-backend hos Nav. Repoet inneholder Kotlin/Java
            Spring Boot-tjenester under apps/, delte biblioteker under libs/ og
            Nais-konfigurasjon under .nais/ og nais/.

            Skriv et kort sammendrag på norsk bokmål ut fra diffen du får:
            - 1-2 setninger om hva endringen gjør og hvorfor.
            - Deretter maks 6 kulepunkter med de konkrete endringene.
            - Nevn eksplisitt endringer i API-kontrakter, databasemigrasjoner,
              Nais-konfigurasjon, avhengigheter og sikkerhet hvis de finnes.
            - Beskriv bare det som faktisk står i diffen. Ikke gjett, ikke fyll
              på med generelle råd, og ikke foreslå forbedringer.
            - Ikke gjenta modultabellen, den legges inn separat.
            - Bruk ingen markdown-overskrifter, kun tekst og kulepunkter.
            - Hvis diffen er avkortet, si det i en avsluttende setning.
        env:
          # Copilot CLI autentiseres med det innebygde Actions-tokenet, som
          # krever permissionen copilot-requests: write. Bruken billes til
          # organisasjonen, så ingen PAT eller lagret secret er nødvendig.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Oppdater PR-beskrivelse
        run: |
          SAMMENDRAG_ARGUMENT=()
          if [[ -n "$SAMMENDRAG_FIL" && -s "$SAMMENDRAG_FIL" ]]; then
            # Fjern eventuelle markører modellen måtte ha funnet på å gjenta,
            # slik at blokkstrukturen i beskrivelsen ikke ødelegges.
            sed -e 's/<!-- pr-beskrivelse:start -->//g' \
                -e 's/<!-- pr-beskrivelse:slutt -->//g' \
                "$SAMMENDRAG_FIL" > "$ARBEIDSKATALOG/sammendrag.md"
            SAMMENDRAG_ARGUMENT=(--sammendrag-fil "$ARBEIDSKATALOG/sammendrag.md")
          else
            echo "::warning::Sammendrag ble ikke generert. Legger inn kun modultabellen."
          fi

          gh pr view "$PR_NUMMER" --json body --jq '.body' \
            > "$ARBEIDSKATALOG/beskrivelse.md"

          python3 .github/scripts/oppdater_pr_beskrivelse.py \
            --beskrivelse-fil "$ARBEIDSKATALOG/beskrivelse.md" \
            --tabell-fil "$ARBEIDSKATALOG/tabell.md" \
            "${SAMMENDRAG_ARGUMENT[@]}" \
            > "$ARBEIDSKATALOG/ny-beskrivelse.md"

          gh pr edit "$PR_NUMMER" --body-file "$ARBEIDSKATALOG/ny-beskrivelse.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
          SAMMENDRAG_FIL: ${{ steps.sammendrag.outputs.response-file }}
