name: Bidrag-grunnlag
on:
  workflow_dispatch:
    inputs:
      miljo:
        description: "Miljø som skal deployes til"
        required: true
        type: choice
        options:
          - prod
          - q1
          - q2
  push:
    branches:
      - '**'
      - '!dependabot/**'
    paths:
      - 'pom.xml'
      - 'libs/bidrag-felles/**'
      - '.nais/bidrag-grunnlag/**.yaml'
      - 'apps/bidrag-grunnlag/**'

jobs:
  detect_changes:
    name: "Sjekk om appen faktisk er endret"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/utled-app-endringer
        id: detect

  bygg_test_og_deploy:
    name: "Bygg, test og deploy"
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && github.actor != 'dependabot[bot]'
    permissions:
      contents: "write"
      id-token: "write"
    uses: ./.github/workflows/bygg_og_deploy.yaml
    secrets: inherit
    with:
      nais_hovedfil_navn: bidrag-grunnlag/nais.yaml
      nais_variabler_filnavn_q1: bidrag-grunnlag/feature.yaml
      deploy_q1: ${{ github.event_name == 'workflow_dispatch' && inputs.miljo == 'q1' }}
      nais_variabler_filnavn_q2: bidrag-grunnlag/main.yaml
      deploy_q2: ${{ github.event_name == 'workflow_dispatch' && inputs.miljo == 'q2' }}
      nais_variabler_filnavn_prod: bidrag-grunnlag/prod.yaml
      deploy_prod: ${{ (github.event_name == 'workflow_dispatch' && inputs.miljo == 'prod') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      maven_options: -B -fae -pl apps/bidrag-grunnlag
      maven_cache_paths: |
        pom.xml
        apps/bidrag-grunnlag/pom.xml
      ktlint_paths: apps/bidrag-grunnlag/src/**/*.kt
      docker_context: ./apps/bidrag-grunnlag
      image_suffix: bidrag-grunnlag
      tag: bidrag-grunnlag
