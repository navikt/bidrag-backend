name: Bidrag-admin-fss
on:
  workflow_call:
    inputs:
      bibliotekartefakt:
        description: Navn på artefaktet med ferdige biblioteker fra bygg-apper.
        required: false
        type: string
        default: ''
      miljo:
        required: false
        type: string
        default: ''
      hopp_over_tester:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      miljo:
        description: "Miljø som skal deployes til"
        required: true
        type: choice
        options:
          - prod
          - q1
      hopp_over_tester:
        description: >-
          Hopp over tester og ktlint for å tvinge gjennom en deploy.
          Fungerer kun for q1/q2 - ignoreres for prod.
        required: false
        type: boolean
        default: false

env:
  APP_PATHS: |
    pom.xml
    libs/bidrag-felles/**
    .nais/bidrag-admin-fss/**.yaml
    apps/bidrag-admin/pom.xml
    apps/bidrag-admin/bidrag-admin-fss/**

jobs:
  bygg_test_og_deploy:
    name: "Bygg, test og deploy"
    permissions:
      contents: "write"
      id-token: "write"
    uses: ./.github/workflows/bygg_og_deploy.yaml
    secrets: inherit
    with:
      bibliotekartefakt: ${{ inputs.bibliotekartefakt }}
      nais_cluster: fss
      nais_hovedfil_navn: bidrag-admin-fss/nais.yaml
      nais_variabler_filnavn_q1: bidrag-admin-fss/dev.yaml
      deploy_q1: ${{ github.event_name == 'workflow_dispatch' && inputs.miljo == 'q1' }}
      nais_variabler_filnavn_prod: bidrag-admin-fss/prod.yaml
      deploy_prod: ${{ (github.event_name == 'workflow_dispatch' && inputs.miljo == 'prod') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      skip_tester: ${{ inputs.hopp_over_tester == true && (inputs.miljo == 'q1' || inputs.miljo == 'q2') }}
      maven_options: -B -fae -pl apps/bidrag-admin/bidrag-admin-fss
      maven_cache_paths: |
        pom.xml
        apps/bidrag-admin/pom.xml
        apps/bidrag-admin/bidrag-admin-fss/pom.xml
      ktlint_paths: apps/bidrag-admin/bidrag-admin-fss/src/**/*.kt
      docker_context: ./apps/bidrag-admin/bidrag-admin-fss
      dockerfile_with_path: ./apps/bidrag-admin/bidrag-admin-fss/Dockerfile
      image_suffix: bidrag-admin-fss
      tag: bidrag-admin-fss
