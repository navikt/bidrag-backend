name: Bidrag-kafka-manager
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Miljø som skal deployes til"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches:
      - '**'
      - '!dependabot/**'
    paths:
      - '.nais/bidrag-kafka-manager/**.yaml'
      - 'apps/bidrag-kafka-manager/**'

jobs:
  detect_changes:
    name: "Sjekk om appen faktisk er endret"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/utled-app-endringer
        id: detect

  # bidrag-kafka-manager er kun en Dockerfile som pakker inn kafbat/kafka-ui med egen
  # config.yml — ingen pom.xml/kildekode å bygge eller teste med Maven, derfor bygges
  # og deployes den direkte her istedenfor via de gjenbrukbare bygg_og_deploy(-_prod)-workflowene.
  deploy_dev:
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && ((github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'))
    name: "Build and deploy to dev"
    concurrency:
      group: deploy-kafka-manager-dev-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # v0
        id: docker-push
        with:
          team: bidrag
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: apps/bidrag-kafka-manager/Dockerfile
          docker_context: ./apps/bidrag-kafka-manager
          image_suffix: bidrag-kafka-manager
          tag: bidrag-kafka-manager
      - name: Deploy to dev-gcp
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/bidrag-kafka-manager/dev.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}

  deploy_prod:
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'))
    name: "Build and deploy to prod"
    concurrency:
      group: deploy-kafka-manager-prod-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # v0
        id: docker-push
        with:
          team: bidrag
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: apps/bidrag-kafka-manager/Dockerfile
          docker_context: ./apps/bidrag-kafka-manager
          image_suffix: bidrag-kafka-manager
          tag: bidrag-kafka-manager
      - name: Deploy to prod-gcp
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/bidrag-kafka-manager/prod.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}
