name: Bidrag-dokumentmal
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Miljø som skal deployes til"
        required: true
        type: choice
        options:
          - prod
          - q1
  push:
    branches:
      - '**'
    paths:
      - '.nais/bidrag-dokumentmal/**.yaml'
      - 'apps/bidrag-dokumenthåndtering/bidrag-dokument-produksjon/bidrag-dokumentmal/**'

# bidrag-dokumentmal er en Node/React-app, ikke et Maven-prosjekt, og kan derfor ikke bruke
# den delte bygg_og_deploy(_prod).yaml-workflowen, som alltid kjører et `mvn ... clean install`-steg.
# Denne workflowen er derfor selvstendig, tilsvarende bidrag-pdfgen.yaml.
jobs:
  detect_changes:
    name: "Sjekk om appen faktisk er endret"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/utled-app-endringer
        id: detect

  deploy_prod:
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'))
    name: "Build and deploy to prod"
    concurrency:
      group: deploy-dokumentmal-prod-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # v0
        id: docker-push
        with:
          team: bidrag
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: bidrag-dokumentmal
          tag: bidrag-dokumentmal
          docker_context: ./apps/bidrag-dokumenthåndtering/bidrag-dokument-produksjon/bidrag-dokumentmal
          dockerfile: ./apps/bidrag-dokumenthåndtering/bidrag-dokument-produksjon/bidrag-dokumentmal/Dockerfile
          build_secrets: |
            "reader_token=${{ secrets.READER_TOKEN }}"
      - name: Deploy to prod-gcp
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/bidrag-dokumentmal/nais.yaml
          VARS: .nais/bidrag-dokumentmal/prod.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}

  deploy_q1:
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && (success() && ((github.event_name == 'push' && github.ref != 'refs/heads/main' && github.actor != 'dependabot[bot]') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'q1')))
    name: "Build and deploy to Q1"
    concurrency:
      group: deploy-dokumentmal-q1-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # v0
        id: docker-push
        with:
          team: bidrag
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: bidrag-dokumentmal
          tag: bidrag-dokumentmal
          docker_context: ./apps/bidrag-dokumenthåndtering/bidrag-dokument-produksjon/bidrag-dokumentmal
          dockerfile: ./apps/bidrag-dokumenthåndtering/bidrag-dokument-produksjon/bidrag-dokumentmal/Dockerfile
          build_secrets: |
            "reader_token=${{ secrets.READER_TOKEN }}"
      - name: Deploy to dev-gcp
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/bidrag-dokumentmal/nais.yaml
          VARS: .nais/bidrag-dokumentmal/q1.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}
