name: Bidrag-maskinporten-client
on:
  workflow_dispatch:
    inputs:
      miljo:
        description: "Miljø som skal deployes til"
        required: true
        type: choice
        options:
          - prod
          - q1
  pull_request:
    types: [labeled, unlabeled]
    paths:
      - 'pom.xml'
      - 'libs/bidrag-felles/**'
      - '.nais/bidrag-maskinporten-client/**.yaml'
      - 'apps/bidrag-maskinporten-client/**'
  push:
    branches:
      - '**'
      - '!dependabot/**'
    paths:
      - 'pom.xml'
      - 'libs/bidrag-felles/**'
      - '.nais/bidrag-maskinporten-client/**.yaml'
      - 'apps/bidrag-maskinporten-client/**'

jobs:
  detect_changes:
    name: "Sjekk om appen faktisk er endret"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/utled-app-endringer
        id: detect

  finn_miljo:
    name: "Bestem hvilke miljø som skal deployes"
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      pull-requests: "read"
    outputs:
      deploy_q1: ${{ steps.finn.outputs.deploy_q1 }}
      deploy_prod: ${{ steps.finn.outputs.deploy_prod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/finn-deploy-miljo
        id: finn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dispatch-miljo: ${{ inputs.miljo }}

  bygg_test_og_deploy:
    name: "Bygg, test og deploy"
    needs: finn_miljo
    permissions:
      contents: "write"
      id-token: "write"
    uses: ./.github/workflows/bygg_og_deploy.yaml
    secrets: inherit
    with:
      nais_hovedfil_navn: bidrag-maskinporten-client/nais.yaml
      nais_variabler_filnavn_q1: bidrag-maskinporten-client/dev.yaml
      deploy_q1: ${{ needs.finn_miljo.outputs.deploy_q1 == 'true' }}
      nais_variabler_filnavn_prod: bidrag-maskinporten-client/prod.yaml
      deploy_prod: ${{ needs.finn_miljo.outputs.deploy_prod == 'true' }}
      maven_options: -B -fae -pl apps/bidrag-maskinporten-client
      maven_cache_paths: |
        pom.xml
        apps/bidrag-maskinporten-client/pom.xml
      ktlint_paths: apps/bidrag-maskinporten-client/src/**/*.kt
      docker_context: ./apps/bidrag-maskinporten-client
      image_suffix: bidrag-maskinporten-client
      tag: bidrag-maskinporten-client
