name: Bidrag-aktørregister
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Miljø som skal deployes til"
        required: true
        type: choice
        options:
          - prod
          - q1
          - q2
          - q1+q2
  push:
    branches:
      - '**'
      - '!dependabot/**'
    paths:
      - '.nais/bidrag-aktoerregister/**.yaml'
#      - '.github/workflows/bidrag-aktoerregister.yaml' //TODO(Slå på etter migrering)
#     - 'pom.xml' //TODO(Slå på etter migrering)
      - 'apps/bidrag-aktoerregister/**'

jobs:
  detect_changes:
    name: "Sjekk om appen faktisk er endret"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/utled-app-endringer
        id: detect

  bygg_og_test:
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && (github.event_name == 'push' && github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/main')
    name: "Bygg og test"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      # Egen, smal cache-nøkkel (kun denne appens pom-kjede) istedenfor setup-java sin
      # innebygde `cache: maven`, som hasher **alle** pom.xml i monorepoet og dermed
      # invalideres av endringer i moduler denne jobben ikke bygger.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-bidrag-aktoerregister-${{ hashFiles('pom.xml', 'apps/bidrag-aktoerregister/pom.xml') }}
          restore-keys: |
            maven-bidrag-aktoerregister-
      - uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        with:
          servers: |
            [
              {
                "id": "github",
                "username": "x-access-token",
                "password": "${{ secrets.READER_TOKEN }}"
              }
            ]
      - name: Bygg og kjør tester (inkl. ktlint)
        run: mvn -B -fae verify -pl apps/bidrag-aktoerregister -am

  deploy_prod:
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'))
    name: "Build and deploy to prod"
    concurrency:
      group: deploy-aktoerregister-prod-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: "write"
      id-token: "write"
    uses: ./.github/workflows/bygg_og_deploy_prod.yaml
    secrets: inherit
    with:
      maven_options: -B -fae -pl apps/bidrag-aktoerregister -am
      maven_cache_paths: |
        pom.xml
        apps/bidrag-aktoerregister/pom.xml
      ktlint_paths: apps/bidrag-aktoerregister/src/**/*.kt
      docker_context: ./apps/bidrag-aktoerregister
      nais_variabler_filnavn: bidrag-aktoerregister/prod.yaml
      nais_hovedfil_navn: bidrag-aktoerregister/nais.yaml
      image_suffix: bidrag-aktoerregister
      tag: bidrag-aktoerregister

  deploy_q1:
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && (success() && ((github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/q1/') || startsWith(github.ref, 'refs/heads/Q1/'))) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'q1' || github.event.inputs.environment == 'q1+q2'))))
    name: "Build and deploy to Q1"
    concurrency:
      group: deploy-aktoerregister-q1-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: "read"
      id-token: "write"
    uses: ./.github/workflows/bygg_og_deploy.yaml
    secrets: inherit
    with:
      maven_options: -B -fae -pl apps/bidrag-aktoerregister -am
      maven_cache_paths: |
        pom.xml
        apps/bidrag-aktoerregister/pom.xml
      ktlint_paths: apps/bidrag-aktoerregister/src/**/*.kt
      docker_context: ./apps/bidrag-aktoerregister
      nais_variabler_filnavn: bidrag-aktoerregister/q1.yaml
      nais_hovedfil_navn: bidrag-aktoerregister/nais.yaml
      image_suffix: bidrag-aktoerregister
      tag: bidrag-aktoerregister

  deploy_q2:
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && (success() && ((github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/q2/') || startsWith(github.ref, 'refs/heads/Q2/'))) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'q2' || github.event.inputs.environment == 'q1+q2'))))
    name: "Build and deploy to Q2"
    concurrency:
      group: deploy-aktoerregister-q2-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: "read"
      id-token: "write"
    uses: ./.github/workflows/bygg_og_deploy.yaml
    secrets: inherit
    with:
      maven_options: -B -fae -pl apps/bidrag-aktoerregister -am
      maven_cache_paths: |
        pom.xml
        apps/bidrag-aktoerregister/pom.xml
      ktlint_paths: apps/bidrag-aktoerregister/src/**/*.kt
      docker_context: ./apps/bidrag-aktoerregister
      nais_variabler_filnavn: bidrag-aktoerregister/q2.yaml
      nais_hovedfil_navn: bidrag-aktoerregister/nais.yaml
      image_suffix: bidrag-aktoerregister
      tag: bidrag-aktoerregister
