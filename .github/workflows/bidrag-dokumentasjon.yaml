name: Bidrag-dokumentasjon
on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/bidrag-dokumentasjon.yaml'
      - 'apps/bidrag-dokumentasjon/**'
  pull_request:
    paths:
      - '.github/workflows/bidrag-dokumentasjon.yaml'
      - 'apps/bidrag-dokumentasjon/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
defaults:
  run:
    working-directory: ./apps/bidrag-dokumentasjon/frontend/bidrag-dokumentasjon
jobs:
  detect_changes:
    name: "Sjekk om appen faktisk er endret"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: "read"
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/utled-app-endringer
        id: detect
  build:
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/bidrag-dokumentasjon/frontend/bidrag-dokumentasjon/package.json
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current
          check-latest: true
          cache: pnpm
          cache-dependency-path: apps/bidrag-dokumentasjon/frontend/bidrag-dokumentasjon/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@navikt'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Build project
        run: pnpm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./apps/bidrag-dokumentasjon/frontend/bidrag-dokumentasjon/dist
  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect_changes, build]
    if: needs.detect_changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
