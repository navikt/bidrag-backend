name: Bidrag-dokumentasjon
on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/bidrag-dokumentasjon.yaml'
      - 'apps/bidrag-dokumentasjon/**'
  pull_request:
    paths:
      - '.github/workflows/bidrag-dokumentasjon.yaml'
      - 'apps/bidrag-dokumentasjon/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
defaults:
  run:
    working-directory: ./apps/bidrag-dokumentasjon/frontend/bidrag-dokumentasjon
env:
  NPM_TOKEN: ${{ secrets.READER_TOKEN }}
jobs:
  detect_changes:
    name: "Sjekk om appen faktisk er endret"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/utled-app-endringer
        id: detect
  build:
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: apps/bidrag-dokumentasjon/frontend/bidrag-dokumentasjon/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('apps/bidrag-dokumentasjon/frontend/bidrag-dokumentasjon/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: current
          check-latest: true
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build project
        run: yarn build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./apps/bidrag-dokumentasjon/frontend/bidrag-dokumentasjon/dist
  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: [detect_changes, build]
    if: needs.detect_changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
