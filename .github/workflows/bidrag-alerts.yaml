name: Bidrag-alerts
on:
  push:
    branches:
      - '**'
    paths:
      - 'util/bidrag-alerts/**'
  workflow_dispatch:

jobs:
  detect_changes:
    name: "Sjekk om alerts faktisk er endret"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/utled-app-endringer
        id: detect

  deploy_dev:
    name: "Deploy alerts til dev"
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy til dev-fss
        uses: nais/deploy/actions/deploy@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
        env:
          CLUSTER: dev-fss
          RESOURCE: util/bidrag-alerts/bidrag-alerts-dev.yaml
      - name: Deploy til dev-gcp
        uses: nais/deploy/actions/deploy@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: util/bidrag-alerts/bidrag-alerts-dev.yaml

  deploy_prod:
    name: "Deploy alerts til prod"
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy til prod-fss
        uses: nais/deploy/actions/deploy@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
        env:
          CLUSTER: prod-fss
          RESOURCE: util/bidrag-alerts/bidrag-alerts-prod.yaml
      - name: Deploy til prod-gcp
        uses: nais/deploy/actions/deploy@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: util/bidrag-alerts/bidrag-alerts-prod.yaml
