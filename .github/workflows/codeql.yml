name: "CodeQL Advanced"

on:
  workflow_dispatch:
  schedule:
    - cron: '25 22 * * *'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up JDK
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: 21
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Maven settings for GitHub Packages
      if: matrix.language == 'java-kotlin'
      uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
      with:
        servers: |
          [
            {
              "id": "github",
              "username": "x-access-token",
              "password": "${{ secrets.READER_TOKEN }}"
            },
            {
              "id": "github2",
              "username": "x-access-token",
              "password": "${{ secrets.READER_TOKEN }}"
            }
          ]

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      # Bygger hele Maven-reactoren (alle moduler) fremfor kun én app, siden CodeQL
      # analyserer hele monorepoet i ett pass.
      #
      # kotlin.compiler.execution.strategy=in-process og kotlin.incremental=false:
      # moduler som blander Java og Kotlin i samme modul (f.eks. bidrag-dokument-journalpost)
      # løser Java-referanser via "joint compilation" i kotlin-maven-plugin. Kotlin-daemonen
      # kjører dette i en frakoblet bakgrunnsprosess som CodeQL sin build-tracer ikke ser inn i,
      # noe som ga falske "Unresolved reference"-feil under sporet bygg. In-process-strategien
      # tvinger kompilering til å skje i samme JVM-prosess som mvn, slik at tracer'en fanger den opp.
      if: matrix.build-mode == 'manual'
      shell: bash
      run: mvn -B -fae install -DskipTests -Dmaven.antrun.skip=true -Dparallel=all -DperCoreThreadCount=true -DthreadCount=10 -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.incremental=false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
      with:
        category: "/language:${{matrix.language}}"
