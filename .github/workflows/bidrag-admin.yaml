name: Bidrag-admin
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Miljø som skal deployes til"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches:
      - '**'
      - '!dependabot/**'
    paths:
      - '.nais/bidrag-admin/**.yaml'
#      - '.github/workflows/bidrag-admin.yaml' //TODO(Slå på etter migrering)
#     - 'pom.xml' //TODO(Slå på etter migrering)
      - 'apps/bidrag-admin/pom.xml'
      - 'apps/bidrag-admin/bidrag-admin-gcp/**'

jobs:
  bygg_og_test:
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/main'
    name: "Bygg og test"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      # Egen, smal cache-nøkkel (kun denne appens pom-kjede) istedenfor setup-java sin
      # innebygde `cache: maven`, som hasher **alle** pom.xml i monorepoet og dermed
      # invalideres av endringer i moduler denne jobben ikke bygger.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-bidrag-admin-gcp-${{ hashFiles('pom.xml', 'apps/bidrag-admin/pom.xml', 'apps/bidrag-admin/bidrag-admin-gcp/pom.xml') }}
          restore-keys: |
            maven-bidrag-admin-gcp-
      - uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        with:
          servers: |
            [
              {
                "id": "github",
                "username": "x-access-token",
                "password": "${{ secrets.READER_TOKEN }}"
              }
            ]
      - name: Bygg og kjør tester (inkl. ktlint)
        run: mvn -B -fae verify -pl apps/bidrag-admin/bidrag-admin-gcp -am

  deploy_dev:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    name: "Build and deploy to dev"
    concurrency:
      group: deploy-admin-dev-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: "read"
      id-token: "write"
    uses: ./.github/workflows/bygg_og_deploy.yaml
    secrets: inherit
    with:
      maven_options: -B -fae -pl apps/bidrag-admin/bidrag-admin-gcp -am
      maven_cache_paths: |
        pom.xml
        apps/bidrag-admin/pom.xml
        apps/bidrag-admin/bidrag-admin-gcp/pom.xml
      ktlint_paths: apps/bidrag-admin/bidrag-admin-gcp/src/**/*.kt
      docker_context: ./apps/bidrag-admin/bidrag-admin-gcp
      nais_variabler_filnavn: bidrag-admin/dev.yaml
      nais_hovedfil_navn: bidrag-admin/nais.yaml
      image_suffix: bidrag-admin
      tag: bidrag-admin

  deploy_prod:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    name: "Build and deploy to prod"
    concurrency:
      group: deploy-admin-prod-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: "write"
      id-token: "write"
    uses: ./.github/workflows/bygg_og_deploy_prod.yaml
    secrets: inherit
    with:
      maven_options: -B -fae -pl apps/bidrag-admin/bidrag-admin-gcp -am
      maven_cache_paths: |
        pom.xml
        apps/bidrag-admin/pom.xml
        apps/bidrag-admin/bidrag-admin-gcp/pom.xml
      ktlint_paths: apps/bidrag-admin/bidrag-admin-gcp/src/**/*.kt
      docker_context: ./apps/bidrag-admin/bidrag-admin-gcp
      nais_variabler_filnavn: bidrag-admin/prod.yaml
      nais_hovedfil_navn: bidrag-admin/nais.yaml
      image_suffix: bidrag-admin
      tag: bidrag-admin


  deploy_unleash_dev:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    name: "Deploy unleash til dev"
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy unleash to dev-gcp
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/bidrag-admin/unleash.yaml
          VARS: .nais/bidrag-admin/dev.yaml

  deploy_unleash_prod:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    runs-on: ubuntu-latest
    name: "Deploy unleash til prod"
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy unleash to prod-gcp
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/bidrag-admin/unleash.yaml
          VARS: .nais/bidrag-admin/prod.yaml
