name: Bidrag-elin-stub
on:
  workflow_dispatch:
    inputs:
      miljo:
        description: "Miljø som skal deployes til"
        required: true
        type: choice
        options:
          - q2
  push:
    branches:
      - '**'
      - '!dependabot/**'
    paths:
      - 'pom.xml'
      - 'libs/bidrag-felles/**'
      - '.nais/bidrag-elin-stub/**.yaml'
      - 'apps/bidrag-elin-stub/**'

jobs:
  detect_changes:
    name: "Sjekk om appen faktisk er endret"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/utled-app-endringer
        id: detect

  bygg_test_og_deploy:
    name: "Bygg, test og deploy"
    needs: detect_changes
    if: needs.detect_changes.outputs.changed == 'true' && github.actor != 'dependabot[bot]'
    permissions:
      contents: "write"
      id-token: "write"
    uses: ./.github/workflows/bygg_og_deploy.yaml
    secrets: inherit
    with:
      nais_hovedfil_navn: bidrag-elin-stub/nais.yaml
      nais_variabler_filnavn_q2: bidrag-elin-stub/main.yaml
      deploy_q2: ${{ github.event_name == 'workflow_dispatch' && inputs.miljo == 'q2' }}
      maven_options: -B -fae -pl apps/bidrag-elin-stub
      maven_cache_paths: |
        pom.xml
        apps/bidrag-elin-stub/pom.xml
      ktlint_paths: apps/bidrag-elin-stub/src/**/*.kt
      docker_context: ./apps/bidrag-elin-stub
      image_suffix: bidrag-elin-stub
