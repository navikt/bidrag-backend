version: 2
registries:
  maven-github:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release
    username: x-access-token
    password: no-secret-required
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.READER_TOKEN}}
    scope: "@navikt"
updates:
  - package-ecosystem: "npm"
    directories:
      - "/util/bidrag-cli"
      - "/util/bidrag-cloudfunctions/postgres-auditlog"
      - "/apps/bidrag-dokumentasjon/frontend/bidrag-dokumentasjon"
      - "/apps/bidrag-dokumenthåndtering/bidrag-dokument-produksjon/bidrag-dokumentmal"
      - "/apps/bidrag-dokumenthåndtering/bidrag-dokument-forsendelse/script"
    registries:
      - "npm-github"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Oslo"
    groups:
      npm-dependencies:
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "[dependency] "
  - package-ecosystem: "maven"
    # Avgrens versjonsoppdateringer til rot-POM; modulene har egne jobber.
    directory: "/"
    exclude-paths:
      - "apps/**"
      - "libs/**"
    cooldown:
      default-days: 7
    registries:
      - "maven-github"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Oslo"
    groups:
      maven-root-dependencies:
        patterns:
          - "*"
      maven-root-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "maven"
    commit-message:
      prefix: "[dependency] "
  # Rot-POM-en trengs for arvede versjoner. Oppdater ignore-listene ved nye rotavhengigheter.
  - package-ecosystem: "maven"
