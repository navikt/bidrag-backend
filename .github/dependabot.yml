version: 2
registries:
  maven-github:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release
    username: x-access-token
    password: no-secret-required
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.READER_TOKEN}}
    scope: "@navikt"
updates:
  - package-ecosystem: "npm"
    directories:
      - "/util/bidrag-cli"
      - "/util/bidrag-cloudfunctions/postgres-auditlog"
      - "/apps/bidrag-dokumentasjon/frontend/bidrag-dokumentasjon"
      - "/apps/bidrag-dokumenthåndtering/bidrag-dokument-produksjon/bidrag-dokumentmal"
      - "/apps/bidrag-dokumenthåndtering/bidrag-dokument-forsendelse/script"
    registries:
      - "npm-github"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Oslo"
    groups:
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
      npm-security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "[dependency] "
  - package-ecosystem: "maven"
    # Avgrens rotjobben til rot-POM; appene og bibliotekene har egne jobber.
    directory: "/"
    exclude-paths:
      - "apps/**"
      - "libs/**"
    cooldown:
      default-days: 7
    registries:
      - "maven-github"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Oslo"
    groups:
      maven-root-major:
        patterns:
          - "*"
        update-types:
          - "major"
      maven-root-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      maven-root-security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
      maven-root-security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "maven"
    commit-message:
      prefix: "[dependency] "
  # Samle alle bibliotek-POM-er i én jobb. Oppdater ignore-listen ved nye rotavhengigheter.
  - package-ecosystem: "maven"
    directories:
      - "/libs/**/*"
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.apache.maven.plugins:maven-failsafe-plugin"
