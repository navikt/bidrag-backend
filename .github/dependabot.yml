      - dependency-name: "org.codehaus.mojo:versions-maven-plugin"
    registries:
      - "maven-github"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Oslo"
    groups:
