name: 'Utled app-endringer'
description: >-
  Sjekker om en branch har endringer i workflowens on.push.paths sammenlignet
  med main (merge-base). Slik unngår vi bygg etter merge fra main når appen
  ikke er endret på branchen. Push til main og andre hendelser regnes alltid
  som endret. Filtreringen gjøres av finn_berorte_apper.py.
outputs:
  changed:
    description: "'true' ved endring i appens paths, push til main eller andre hendelser; ellers 'false'"
    value: ${{ steps.detect.outputs.changed }}
runs:
  using: composite
  steps:
    - name: Finn endringer i workflowens paths
      id: detect
      shell: bash
      env:
        GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
          python3 -m pip install --quiet --disable-pip-version-check PyYAML==6.0.3
        fi
        python3 .github/scripts/finn_berorte_apper.py --workflow
